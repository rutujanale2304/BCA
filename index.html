<!DOCTYPE html>
<html lang="en" ng-app="studentApp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Application</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="studentController">

    <h2>Student Application</h2>

    <h3>Add / Update Student</h3>

    <form ng-submit="saveStudent()">

        <label for="name">Name:</label>
        <input type="text" id="name" ng-model="student.name" placeholder="Enter student name" required>

        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" ng-model="student.age" placeholder="Enter student age" min="1" required>

        <br><br>

        <label for="course">Course:</label>
        <input type="text" id="course" ng-model="student.course" placeholder="Enter course name" required>

        <br><br>

        <button type="submit">
            {{ student._id ? 'Update Student' : 'Add Student' }}
        </button>

        <button type="button" ng-click="clearForm()">Clear</button>

    </form>

    <p>{{ message }}</p>

    <h3>Student List</h3>

    <button type="button" ng-click="getStudents()">Refresh List</button>

    <br><br>

    <table border="1" cellpadding="8">

        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr ng-repeat="s in students">
                <td>{{ s.name }}</td>
                <td>{{ s.age }}</td>
                <td>{{ s.course }}</td>

                <td>
                    <button type="button" ng-click="editStudent(s)">Edit</button>
                    <button type="button" ng-click="deleteStudent(s._id)">Delete</button>
                </td>
            </tr>

            <tr ng-if="students.length === 0">
                <td colspan="4">No students found.</td>
            </tr>
        </tbody>

    </table>

    <script>
        var app = angular.module("studentApp", []);

        app.controller("studentController", function($scope, $http) {

            var api = "http://localhost:1500/students";

            $scope.students = [];
            $scope.student = {};
            $scope.message = "";

            // Get all students
            $scope.getStudents = function() {
                $http.get(api).then(function(response) {
                    $scope.students = response.data;
                }, function() {
                    $scope.message = "Unable to load students. Check server connection.";
                });
            };

            // Add or Update student
            $scope.saveStudent = function() {

                var data = {
                    name: $scope.student.name,
                    age: Number($scope.student.age),
                    course: $scope.student.course
                };

                if ($scope.student._id) {

                    $http.put(api + "/" + $scope.student._id, data)
                        .then(function() {
                            $scope.message = "Student updated successfully!";
                            $scope.clearForm();
                            $scope.getStudents();
                        }, function() {
                            $scope.message = "Unable to update student.";
                        });

                } else {

                    $http.post(api, data)
                        .then(function() {
                            $scope.message = "Student added successfully!";
                            $scope.clearForm();
                            $scope.getStudents();
                        }, function() {
                            $scope.message = "Unable to add student.";
                        });
                }
            };

            // Edit student
            $scope.editStudent = function(s) {
                $scope.student = {
                    _id: s._id,
                    name: s.name,
                    age: s.age,
                    course: s.course
                };

                $scope.message = "Edit details and click Update Student.";
            };

            // Delete student
            $scope.deleteStudent = function(id) {

                if (confirm("Do you want to delete this student?")) {

                    $http.delete(api + "/" + id)
                        .then(function() {
                            $scope.message = "Student deleted successfully!";
                            $scope.getStudents();
                        }, function() {
                            $scope.message = "Unable to delete student.";
                        });
                }
            };

            // Clear form
            $scope.clearForm = function() {
                $scope.student = {};
                $scope.message = "";
            };

            // Load students when page opens
            $scope.getStudents();

        });
    </script>

</body>

</html>
